name: Build episodes index

on:
  schedule:
    # 09:00 UTC daily (about 3am Springfield time, 4am during daylight saving)
    - cron: "0 9 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/build_index.py"
      - ".github/workflows/build-index.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build episodes-index.json
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python scripts/build_index.py

      - name: Commit if the index changed
        run: |
          git config user.name  "innerverse-index-bot"
          git config user.email "actions@github.com"
          # Stage first. A brand-new file is untracked, and `git diff` does
          # not see untracked files, so checking before staging would report
          # "no change" on the very first run and silently discard the build.
          git add -A episodes-index.json episodes-extra.json
          if git diff --cached --quiet; then
            echo "No change to the index, nothing to commit."
          else
            git commit -m "Rebuild episodes index ($(date -u +%Y-%m-%d))"
            git push
          fi
